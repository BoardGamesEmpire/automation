name: Bug agent

# A reusable workflow that BoardGamesEmpire repositories call when someone
# with write access labels an issue `bug`. The agent triages the issue: it
# asks for detail (`needs-info`), hands it to a person (`ready-for-human`),
# or, when the fix is small and needs no decision, fixes it and opens a draft
# PR (`ready-for-agent`). README.md covers calling it and the one-time setup.
#
# Three jobs, so the agent never holds a token that can write:
#
# - triage: the agent reads the issue and the code, with read-only tools, and
#   returns a decision. No dependency install, so the common outcomes cost
#   little.
# - fix: only for `ready-for-agent`. The agent writes a test and a fix and
#   runs them, which means it runs code it wrote. The job's token can only
#   read, and the caller's setup action restores caches but never saves them,
#   because an issue-triggered job saves into the default branch's cache
#   scope, which that branch's CI restores.
# - publish: holds the app token and runs no agent code. It checks the fix
#   against the limits, commits it through the API, opens the PR, and labels
#   and comments on the issue. bug-agent/publish.sh has the detail.
#
# The prompts and the publish script come from this repository's master
# branch, not from the caller, so a caller sets its limits but not the rules.
# The Claude API federation rule trusts this file on master
# (`job_workflow_ref`) for an allowlist of repository ids.
on:
  workflow_call:
    inputs:
      bge-agent-client-id:
        description: The bge-agent GitHub App's client ID.
        type: string
        required: true
      anthropic-federation-rule-id:
        description: Claude API workload identity federation rule (fdrl_...).
        type: string
        required: true
      anthropic-organization-id:
        description: Anthropic organization UUID.
        type: string
        required: true
      anthropic-service-account-id:
        description: Service account the federated token acts as (svac_...).
        type: string
        required: true
      fix-tools:
        description: >-
          Claude Code tool rules, comma-separated, for the commands that verify
          a fix, such as `Bash(npm run nx:*)`.
        type: string
        required: true
      protected-paths:
        description: >-
          Shell globs, one per line, of paths a fix may not change, on top of
          `.github/*`, which is always protected.
        type: string
        default: ''
      test-paths:
        description: >-
          Shell globs, one per line, of test files, which don't count toward
          the line limit.
        type: string
        default: ''
      module-pattern:
        description: >-
          Bash regex whose first group names a path's module. A fix may change
          at most one module. Empty turns the check off.
        type: string
        default: ''
      max-lines:
        description: Most changed lines a fix may have outside test files.
        type: number
        default: 100
      notes:
        description: >-
          Repository-specific notes for the agent: where its instructions live
          and the commands that verify a fix.
        type: string
        default: ''
    secrets:
      bge-agent-private-key:
        description: The bge-agent GitHub App's private key.
        required: true

env:
  ISSUE_NUMBER: ${{ github.event.issue.number }}
  # Where the prompts and the publish script come from, whichever repository
  # calls. Keep in step with the federation rule's `job_workflow_ref`.
  SHARED_REPOSITORY: BoardGamesEmpire/automation
  SHARED_REF: master
  SHARED_DIR: .bug-agent-shared
  PROTECTED_PATHS: |
    .github/*
    ${{ inputs.protected-paths }}
  TEST_PATHS: ${{ inputs.test-paths }}
  MODULE_PATTERN: ${{ inputs.module-pattern }}
  MAX_LINES: ${{ inputs.max-lines }}
  REPO_NOTES: ${{ inputs.notes }}

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      # The GitHub OIDC token the action exchanges for a short-lived Claude
      # API token (workload identity federation).
      id-token: write
    outputs:
      outcome: ${{ steps.outcome.outputs.outcome }}
      decision: ${{ steps.agent.outputs.structured_output }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SHARED_REPOSITORY }}
          ref: ${{ env.SHARED_REF }}
          path: ${{ env.SHARED_DIR }}
          sparse-checkout: bug-agent
          persist-credentials: false

      - name: Build the prompt
        id: prompt
        run: |
          delim="EOF_$(openssl rand -hex 16)"
          {
            echo "text<<$delim"
            bash "$SHARED_DIR/bug-agent/prompt.sh" triage
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
          rm -rf "$SHARED_DIR"

      - name: Run the agent
        id: agent
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        env:
          GH_TOKEN: ${{ github.token }}
          # Keeps credentials out of the commands the agent runs.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
        with:
          # Workload identity federation, not a stored API key: the action
          # trades this job's GitHub OIDC token for a Claude API token that
          # lasts minutes, so nothing long-lived exists to leak. These are
          # identifiers, not secrets. Setting `anthropic_api_key` alongside
          # them would silently win over them.
          anthropic_federation_rule_id: ${{ inputs.anthropic-federation-rule-id }}
          anthropic_organization_id: ${{ inputs.anthropic-organization-id }}
          anthropic_service_account_id: ${{ inputs.anthropic-service-account-id }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.text }}
          # The model and its reasoning effort are pinned, so they, and what a
          # run costs, change only here and never with the action's or Claude
          # Code's own defaults.
          claude_args: |
            --model claude-opus-5-5
            --effort high
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Bash(gh issue view:*),Bash(git log:*)"
            --json-schema '{"type":"object","properties":{"outcome":{"type":"string","enum":["needs-info","ready-for-human","ready-for-agent"]},"comment":{"type":"string"}},"required":["outcome","comment"],"additionalProperties":false}'

      - name: Read the outcome
        id: outcome
        env:
          DECISION: ${{ steps.agent.outputs.structured_output }}
        run: |
          outcome="$(jq -r '.outcome // ""' <<<"$DECISION")"
          case "$outcome" in
            needs-info | ready-for-human | ready-for-agent) echo "outcome=$outcome" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::no usable outcome in the agent's result"; exit 1 ;;
          esac

  fix:
    needs: triage
    if: needs.triage.outputs.outcome == 'ready-for-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: read
      id-token: write
    outputs:
      result: ${{ steps.agent.outputs.structured_output }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SHARED_REPOSITORY }}
          ref: ${{ env.SHARED_REF }}
          path: ${{ env.SHARED_DIR }}
          sparse-checkout: bug-agent
          persist-credentials: false

      # The caller's own: installs what verifying a fix needs, and must not
      # save any cache.
      - uses: ./.github/actions/bug-agent-setup

      # The shared checkout is removed before the agent starts, so the fix
      # collected below holds only the agent's changes.
      - name: Build the prompt
        id: prompt
        env:
          DECISION: ${{ needs.triage.outputs.decision }}
        run: |
          delim="EOF_$(openssl rand -hex 16)"
          {
            echo "text<<$delim"
            bash "$SHARED_DIR/bug-agent/prompt.sh" fix
            echo
            echo "## The triage run's reasoning"
            echo
            jq -r '.comment' <<<"$DECISION"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
          rm -rf "$SHARED_DIR"

      - name: Run the agent
        id: agent
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
        with:
          anthropic_federation_rule_id: ${{ inputs.anthropic-federation-rule-id }}
          anthropic_organization_id: ${{ inputs.anthropic-organization-id }}
          anthropic_service_account_id: ${{ inputs.anthropic-service-account-id }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: |
            --model claude-opus-5-5
            --effort high
            --max-turns 80
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(gh issue view:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),${{ inputs.fix-tools }}"
            --json-schema '{"type":"object","properties":{"outcome":{"type":"string","enum":["fixed","ready-for-human"]},"comment":{"type":"string"},"commit_subject":{"type":"string"},"commit_body":{"type":"string"},"pr_body":{"type":"string"}},"required":["outcome","comment","commit_subject","commit_body","pr_body"],"additionalProperties":false}'

      # The working tree's changes, as the agent left them. Whatever the
      # caller's setup action writes must be gitignored, or it lands in the
      # fix and the publish job's limits refuse it.
      - name: Collect the fix
        run: |
          git add -A
          git diff --cached --binary > "$RUNNER_TEMP/fix.patch"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fix-patch
          path: ${{ runner.temp }}/fix.patch
          retention-days: 7

  publish:
    needs: [triage, fix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The bge-agent GitHub App. Its commits through the API are signed by
      # GitHub and attributed to the app's bot account, and a PR it opens
      # triggers CI, which one opened with the default token would not. Scoped
      # to the calling repository, with no workflow permission and no way to
      # merge.
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.bge-agent-client-id }}
          private-key: ${{ secrets.bge-agent-private-key }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SHARED_REPOSITORY }}
          ref: ${{ env.SHARED_REF }}
          path: ${{ env.SHARED_DIR }}
          sparse-checkout: bug-agent
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.fix.result == 'success'
        with:
          name: fix-patch
          path: ${{ runner.temp }}/fix

      - name: Publish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          BASE_SHA: ${{ github.sha }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIAGE_RESULT: ${{ needs.triage.result }}
          TRIAGE_JSON: ${{ needs.triage.outputs.decision }}
          FIX_RESULT: ${{ needs.fix.result }}
          FIX_JSON: ${{ needs.fix.outputs.result }}
          PATCH_FILE: ${{ runner.temp }}/fix/fix.patch
        run: bash "$SHARED_DIR/bug-agent/publish.sh"
